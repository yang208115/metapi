name: Build and Publish GHCR Image

on:
  push:
    branches: [main, master]
    tags: ['v*']
  workflow_dispatch:
    inputs:
      tag:
        description: 镜像标签（例如 manual-20260920）
        required: true
        default: manual
        type: string

permissions:
  contents: read
  packages: write

concurrency:
  group: ghcr-image-${{ github.ref }}-${{ inputs.tag || 'auto' }}
  cancel-in-progress: false

env:
  IMAGE_NAME: ghcr.io/${{ github.repository }}

jobs:
  publish:
    name: Build and publish multi-arch image
    runs-on: ubuntu-latest
    timeout-minutes: 60

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Validate manual tag
        if: github.event_name == 'workflow_dispatch'
        shell: bash
        env:
          IMAGE_TAG: ${{ inputs.tag }}
        run: |
          set -euo pipefail
          if [[ ! "$IMAGE_TAG" =~ ^[A-Za-z0-9_][A-Za-z0-9_.-]{0,127}$ ]]; then
            echo "Invalid Docker tag: $IMAGE_TAG" >&2
            exit 1
          fi

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Log in to GHCR
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract image metadata
        id: meta
        uses: docker/metadata-action@v6
        with:
          images: ${{ env.IMAGE_NAME }}
          flavor: latest=false
          tags: |
            type=raw,value=latest,enable=${{ github.ref == 'refs/heads/main' || github.ref == 'refs/heads/master' || startsWith(github.ref, 'refs/tags/v') }}
            type=sha,prefix=sha-,format=short
            type=semver,pattern={{version}},enable=${{ startsWith(github.ref, 'refs/tags/v') }}
            type=semver,pattern={{major}}.{{minor}},enable=${{ startsWith(github.ref, 'refs/tags/v') }}
            type=semver,pattern={{major}},enable=${{ startsWith(github.ref, 'refs/tags/v') }}
            type=raw,value=${{ inputs.tag || 'manual' }},enable=${{ github.event_name == 'workflow_dispatch' }}

      - name: Build and push multi-arch image
        uses: docker/build-push-action@v7
        with:
          context: .
          file: docker/Dockerfile
          platforms: linux/amd64,linux/arm64,linux/arm/v7
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          provenance: mode=max
          sbom: true
          cache-from: type=gha,scope=ghcr-image
          cache-to: type=gha,mode=max,scope=ghcr-image

      - name: Verify pushed manifests
        shell: bash
        env:
          IMAGE_TAGS: ${{ steps.meta.outputs.tags }}
        run: |
          set -euo pipefail

          while IFS= read -r image; do
            [ -n "$image" ] || continue
            echo "Inspecting $image"
            manifest="$(docker buildx imagetools inspect --raw "$image")"

            for platform in linux/amd64 linux/arm64 linux/arm/v7; do
              os="${platform%%/*}"
              remainder="${platform#*/}"
              arch="${remainder%%/*}"
              variant="${remainder#*/}"

              if [ "$variant" = "$remainder" ]; then
                jq -e --arg os "$os" --arg arch "$arch" \
                  '.manifests[] | select(.platform.os == $os and .platform.architecture == $arch)' \
                  <<< "$manifest" >/dev/null
              else
                jq -e --arg os "$os" --arg arch "$arch" --arg variant "$variant" \
                  '.manifests[] | select(.platform.os == $os and .platform.architecture == $arch and .platform.variant == $variant)' \
                  <<< "$manifest" >/dev/null
              fi
            done
          done <<< "$IMAGE_TAGS"
